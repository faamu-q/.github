name: Model Evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evals/**"
      - "tests/**"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[eval]"; else pip install -r requirements.txt; fi
      - name: Run evaluation suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -d evals ]; then
            python -m pytest -q evals tests
          else
            python -m pytest -q
          fi
