name: Research proposal
description: Propose a quantitative or model-research direction
title: "[Research] "
labels: ["research"]
body:
  - type: input
    id: question
    attributes:
      label: Research question
      placeholder: State one precise question.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this question technically or scientifically useful?
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis or expected contribution
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Proposed methodology
      description: Data, mathematical framework, models, baselines and evaluation.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Data / model provenance
      description: List intended sources and licensing constraints.
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: Define measurable acceptance or falsification criteria.
    validations:
      required: true
